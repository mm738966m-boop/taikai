<!-- ============================================================
  ふるふるハイブリッドスクール 退会（解約）届フォーム
  入力 → 確認 → 完了 の3画面（自己完結HTML）
============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふるふるハイブリッドスクール 退会届</title>
</head>
<body>
<div id="ff-root">
<style>
  #ff-root{--ff-accent:#1d9e75;--ff-accent-d:#0f6e56;--ff-bg:#f4f6f5;--ff-card:#ffffff;--ff-line:#e3e6e5;--ff-text:#1f2421;--ff-sub:#5f6b66;--ff-warnbg:#fef6e7;--ff-warn:#854f0b;--ff-danger:#a32d2d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;color:var(--ff-text);background:var(--ff-bg);padding:24px 12px;min-height:100vh;margin:0;}
  #ff-root *{box-sizing:border-box;}
  #ff-root .ff-card{background:var(--ff-card);border:1px solid var(--ff-line);border-radius:12px;padding:28px 24px;max-width:560px;margin:0 auto;}
  #ff-root .ff-head{text-align:center;border-bottom:1px solid var(--ff-line);padding-bottom:14px;margin-bottom:18px;}
  #ff-root .ff-head small{font-size:13px;color:var(--ff-sub);letter-spacing:.04em;}
  #ff-root .ff-head h1{font-size:21px;font-weight:600;margin:6px 0 0;}
  #ff-root .ff-notice{background:var(--ff-warnbg);border-radius:8px;padding:13px 15px;margin-bottom:20px;}
  #ff-root .ff-notice p{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ff-warn);}
  #ff-root .ff-notice ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ff-sub);}
  #ff-root label.ff-l{display:block;font-size:13px;margin-bottom:5px;}
  #ff-root .req{color:var(--ff-danger);}
  #ff-root .ff-field{margin-bottom:15px;}
  #ff-root input,#ff-root select,#ff-root textarea{width:100%;font-size:15px;font-family:inherit;padding:10px 12px;border:1px solid var(--ff-line);border-radius:8px;background:#fff;color:var(--ff-text);}
  #ff-root input:focus,#ff-root select:focus,#ff-root textarea:focus{outline:none;border-color:var(--ff-accent);box-shadow:0 0 0 3px rgba(29,158,117,.15);}
  #ff-root .ff-agree{background:var(--ff-bg);border-radius:8px;padding:13px 15px;margin-top:6px;display:grid;gap:10px;}
  #ff-root .ff-agree label{display:flex;gap:9px;font-size:13px;line-height:1.5;align-items:flex-start;cursor:pointer;}
  #ff-root .ff-agree input{width:auto;margin-top:3px;flex:none;}
  #ff-root button{font-family:inherit;cursor:pointer;border-radius:8px;font-size:15px;}
  #ff-root .ff-btn-main{width:100%;margin-top:18px;padding:14px;font-weight:600;color:#fff;background:var(--ff-accent);border:none;}
  #ff-root .ff-btn-main:hover{background:var(--ff-accent-d);}
  #ff-root .ff-btn-sub{flex:1;padding:13px;background:#fff;border:1px solid var(--ff-line);color:var(--ff-text);}
  #ff-root .ff-btn-danger{flex:2;padding:13px;font-weight:600;background:var(--ff-danger);border:none;color:#fff;}
  #ff-root .ff-err{display:none;color:var(--ff-danger);font-size:13px;margin:12px 0 0;}
  #ff-root table.ff-sum{width:100%;font-size:14px;border-collapse:collapse;}
  #ff-root table.ff-sum td{padding:9px 10px;border-bottom:1px solid var(--ff-line);vertical-align:top;}
  #ff-root table.ff-sum td.k{color:var(--ff-sub);white-space:nowrap;width:34%;}
  #ff-root .ff-done{text-align:center;padding:14px 0;}
  #ff-root .ff-done .circle{width:58px;height:58px;border-radius:50%;background:#e1f5ee;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;color:var(--ff-accent-d);}
  #ff-root .ff-done h2{font-size:19px;font-weight:600;margin:0 0 10px;}
  #ff-root .ff-done p{font-size:14px;color:var(--ff-sub);line-height:1.8;margin:0;}
</style>

<div class="ff-card">
  <div class="ff-head"><small>ふるふるハイブリッドスクール</small><h1>退会（解約）届</h1></div>

  <div id="ff-step1">
    <div class="ff-notice">
      <p>▼ 退会についてのご案内（利用規約 第9条・第5条）</p>
      <ul>
        <li>お申し出は「退会希望月の10日まで」。10日まで→当月末／11日以降→翌月末で退会</li>
        <li>退会月の月額は満額のお支払いとなります（日割りなし）</li>
        <li>お支払い済みの利用料金は返金いたしかねます</li>
      </ul>
      <p style="margin:8px 0 0;font-size:12px;"><a href="https://fulfull.jp/wp-content/uploads/2021/06/%E3%82%AA%E3%83%B3%E3%83%A9%E3%82%A4%E3%83%B3%E3%82%B5%E3%83%AD%E3%83%B3%E5%88%A9%E7%94%A8%E8%A6%8F%E7%B4%842021.5.20%E6%94%B9.pdf" target="_blank" rel="noopener" style="color:var(--ff-warn);text-decoration:underline;">▶ 利用規約の全文を見る（PDF）</a></p>
    </div>

    <div class="ff-field"><label class="ff-l">申込日（本日）<span class="req">＊</span></label><input type="date" id="f_date"></div>
    <div class="ff-field"><label class="ff-l">お名前（フルネーム）<span class="req">＊</span></label><input type="text" id="f_name" placeholder="山田 太郎"></div>
    <div class="ff-field"><label class="ff-l">ご住所<span class="req">＊</span></label><input type="text" id="f_addr" placeholder="〒000-0000 ○○県○○市…"></div>
    <div class="ff-field"><label class="ff-l">電話番号<span class="req">＊</span></label><input type="tel" id="f_tel" placeholder="090-0000-0000"></div>
    <div class="ff-field"><label class="ff-l">メールアドレス（ご登録のもの）<span class="req">＊</span></label><input type="email" id="f_mail" placeholder="example@mail.com"></div>
    <div class="ff-field"><label class="ff-l">退会理由<span class="req">＊</span></label>
      <select id="f_reason">
        <option value="">選択してください</option>
        <option>学び終えた・目的を達成した</option>
        <option>時間が取れなくなった</option>
        <option>料金の都合</option>
        <option>内容が合わなかった</option>
        <option>その他</option>
      </select>
    </div>
    <div class="ff-field"><label class="ff-l">ご意見・ご要望（任意）</label><textarea id="f_note" rows="2" placeholder="今後の改善のため、よろしければお聞かせください"></textarea></div>

    <div class="ff-agree">
      <label><input type="checkbox" id="c1"><span>退会月の月額は満額発生し、日割り返金がないことに同意します（規約第9条2項）</span></label>
      <label><input type="checkbox" id="c2"><span>お支払い済みの利用料金は返金されないことに同意します（規約第5条3項）</span></label>
      <label><input type="checkbox" id="c3"><span>退会後はサロンのコンテンツを閲覧できないことを理解しました</span></label>
      <label><input type="checkbox" id="c4"><span>退会後は、スクールの各オープンチャットから退出します</span></label>
    </div>

    <p class="ff-err" id="ff-err"></p>
    <button class="ff-btn-main" id="ff-next">確認画面へ →</button>
  </div>

  <div id="ff-step2" style="display:none;">
    <p style="font-size:15px;font-weight:600;text-align:center;margin:0 0 16px;">この内容で退会（解約）を申請します。<br>よろしいですか？</p>
    <table class="ff-sum" id="ff-summary"></table>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="ff-btn-sub" id="ff-back">← 修正する</button>
      <button class="ff-btn-danger" id="ff-submit">退会を申請する</button>
    </div>
  </div>

  <div id="ff-step3" style="display:none;">
    <div class="ff-done">
      <div class="circle">✓</div>
      <h2>退会申請を受け付けました</h2>
      <p>ご登録のメールアドレスへ「受付完了メール」をお送りしました。<br>決済の停止を含む最終手続きが完了しましたら、改めて「退会完了」のご連絡をいたします。</p>
    </div>
  </div>
</div>

<script>
(function(){
  var SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyPfZbdzY7YWWBLKzCSGBJfAMIFhSz_cxzCLw0AX6z7XhsaShhabUJmmsiTk9j5aY1MTw/exec";
  var d=document;
  try{ d.getElementById('f_date').valueAsDate=new Date(); }catch(e){}
  function v(id){return (d.getElementById(id).value||'').trim();}
  function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  d.getElementById('ff-next').onclick=function(){
    var err=d.getElementById('ff-err'),miss=[];
    [['f_date','申込日'],['f_name','お名前'],['f_addr','ご住所'],['f_tel','電話番号'],['f_mail','メールアドレス'],['f_reason','退会理由']].forEach(function(f){if(!v(f[0]))miss.push(f[1]);});
    if(!d.getElementById('c1').checked||!d.getElementById('c2').checked||!d.getElementById('c3').checked||!d.getElementById('c4').checked)miss.push('確認事項への同意（4つすべて）');
    if(miss.length){err.style.display='block';err.textContent='未入力があります：'+miss.join('、');return;}
    err.style.display='none';
    var rows=[['申込日',v('f_date')],['お名前',v('f_name')],['ご住所',v('f_addr')],['電話番号',v('f_tel')],['メールアドレス',v('f_mail')],['退会理由',v('f_reason')]];
    if(v('f_note'))rows.push(['ご意見・ご要望',v('f_note')]);
    d.getElementById('ff-summary').innerHTML=rows.map(function(r){return '<tr><td class="k">'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>';}).join('');
    d.getElementById('ff-step1').style.display='none';d.getElementById('ff-step2').style.display='block';
    window.scrollTo(0,0);
  };
  d.getElementById('ff-back').onclick=function(){d.getElementById('ff-step2').style.display='none';d.getElementById('ff-step1').style.display='block';};
  d.getElementById('ff-submit').onclick=function(){
    var btn=this; btn.disabled=true; btn.textContent='送信中…';
    var data={申込日:v('f_date'),氏名:v('f_name'),住所:v('f_addr'),電話番号:v('f_tel'),メールアドレス:v('f_mail'),退会理由:v('f_reason'),ご意見:v('f_note')};
    function done(){d.getElementById('ff-step2').style.display='none';d.getElementById('ff-step3').style.display='block';window.scrollTo(0,0);}
    if(SUBMIT_URL){
      fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(done).catch(function(){done();});
    }else{ done(); }
  };
})();
</script>
</div>
</body>
</html>
